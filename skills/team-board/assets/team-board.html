<title>Team Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-width console. Top strip = state at a glance; decisions take the screen; a narrow right sidebar holds
   Plans, Team and Work log as collapsible sections, and can be hidden. Below 1100px everything stacks and the page scrolls. */
:root{
  --bg:#eef2f3;--surface:#fff;--raised:#f6f9f9;--ink:#17242a;--muted:#566872;--line:#d3dde0;
  --accent:#0f6b78;--accent-soft:#dff0f2;--on-accent:#fff;
  --ask:#a3480f;--ask-soft:#fcecdd;--ok:#1f7a4d;--ok-soft:#e1f3e9;--idle:#5b6b75;--idle-soft:#e8edef;--bad:#a3392b;--bad-soft:#f8e3df;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1417;--surface:#172126;--raised:#1d292f;--ink:#e2eaed;--muted:#9bacb5;--line:#2a373e;
  --accent:#62c4d4;--accent-soft:#14323a;--on-accent:#0e1417;
  --ask:#f2a766;--ask-soft:#3a2614;--ok:#6fd09b;--ok-soft:#163126;--idle:#a3b2ba;--idle-soft:#26323a;--bad:#f08b7b;--bad-soft:#3a1d18;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1417;--surface:#172126;--raised:#1d292f;--ink:#e2eaed;--muted:#9bacb5;--line:#2a373e;
  --accent:#62c4d4;--accent-soft:#14323a;--on-accent:#0e1417;
  --ask:#f2a766;--ask-soft:#3a2614;--ok:#6fd09b;--ok-soft:#163126;--idle:#a3b2ba;--idle-soft:#26323a;--bad:#f08b7b;--bad-soft:#3a1d18;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
h1{font-family:var(--f-display);font-size:1.45rem;line-height:1.1;margin:0;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px;flex:1;min-width:0}
.stat{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.stat b{font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8rem}
.stat.hot b{color:var(--ask)}
.sys{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;min-height:0}
.cols.wide{grid-template-columns:minmax(0,1fr)}
.cols.wide .side{display:none}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.fold{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;flex:0 0 auto}
.fold.open{flex:1 1 0}
.fold>.head{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:0;border-radius:0;background:none;text-align:left;flex:none}
.fold>.head::before{content:'▸';color:var(--muted);transition:transform .15s}
.fold.open>.head::before{transform:rotate(90deg)}
.fold.open>.head{border-bottom:1px solid var(--line)}
.fold>.body{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden}
.fold .body{padding:2px 12px 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0;flex:1}
.panel>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
h2{font-family:var(--f-display);font-size:1.05rem;margin:0;flex:1}
.count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.body{overflow:auto;padding:4px 14px 12px;flex:1;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
.chip{font-size:.78rem;padding:3px 10px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;padding-top:10px}
.q{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--ask);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.q h3{margin:0;font-size:.95rem;line-height:1.35;font-weight:600}
.src{color:var(--muted);font-size:.76rem;margin:2px 0 6px}
.q p{margin:4px 0;color:var(--muted);font-size:.86rem}
.q p.rec{color:var(--ink)}
.q p.rec b{font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
button{font:inherit;font-size:.84rem;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:disabled{opacity:.5;cursor:default}
.free{display:flex;gap:6px;margin-top:8px}
textarea{flex:1;min-width:0;font:inherit;font-size:.84rem;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);resize:vertical}
.empty{color:var(--muted);padding:12px 0}
.tag{display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}
.working{background:var(--ok-soft);color:var(--ok)}
.idle{background:var(--idle-soft);color:var(--idle)}
.row{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row>div{min-width:0;flex:1}
.row b{font-weight:600}
.sub{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.next{font-size:.8rem;overflow-wrap:anywhere}
.log time{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.ans{padding:0 14px 10px}
.ans summary{cursor:pointer;color:var(--muted);font-size:.84rem;padding:8px 0}
#toggle{white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:1100px){
  html,body{height:auto}
  .app{height:auto;display:flex;flex-direction:column}
  .cols{display:flex;flex-direction:column}
  .panel,.body,.fold,.fold.open,.fold>.body{flex:none;overflow:visible}
  .cols.wide .side{display:flex}
  #toggle{display:none}
}
</style>
<div class="app">
<div class="top">
  <h1>Team Board</h1>
  <div class="stats">
    <div class="stat" id="s-q"><b id="n-q">–</b><span>waiting for you</span></div>
    <div class="stat"><b id="n-a">–</b><span>agents working</span></div>
    <div class="stat"><b id="n-p">–</b><span>active plans</span></div>
  </div>
  <div class="sys" id="sys"></div>
  <button type="button" id="toggle" aria-pressed="false">Hide sidebar</button>
</div>
<div class="cols" id="cols">
  <div class="col">
    <section class="panel" aria-labelledby="h-q">
      <header><h2 id="h-q">Waiting for you</h2><span class="count" id="sum">Connecting…</span></header>
      <div class="chips" id="chips"></div>
      <div class="body"><div class="qgrid" id="qs"></div></div>
      <details class="ans"><summary id="done-s">Answered</summary><div id="done"></div></details>
    </section>
  </div>
  <aside class="side" aria-label="Plans, team and work log">
    <section class="fold open" id="f-plans"><button type="button" class="head" aria-expanded="true" aria-controls="plans"><h2>Plans</h2><span class="count" id="c-p"></span></button><div class="body" id="plans"><div class="empty">Active plans appear here.</div></div></section>
    <section class="fold open" id="f-team"><button type="button" class="head" aria-expanded="true" aria-controls="agents"><h2>Team</h2><span class="count" id="c-a"></span></button><div class="body" id="agents"><div class="empty">The roster appears here.</div></div></section>
    <section class="fold open" id="f-log"><button type="button" class="head" aria-expanded="true" aria-controls="log"><h2>Work log</h2><span class="count" id="c-l"></span></button><div class="body log" id="log"><div class="empty">Each agent's report appears here.</div></div></section>
  </aside>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const when=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})};
let db=null,qs=[],filter='All';
const drafts={};
const pref={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
['f-plans','f-team','f-log'].forEach(id=>{const f=$(id),h=f.querySelector('.head'),b=f.querySelector('.body');
  const set=o=>{f.classList.toggle('open',o);b.hidden=!o;h.setAttribute('aria-expanded',String(o))};
  const v=pref.get(id);if(v!==null)set(v);h.onclick=()=>{const o=!f.classList.contains('open');set(o);pref.set(id,o)}});
function setWide(w){$('cols').classList.toggle('wide',w);const b=$('toggle');b.textContent=w?'Show sidebar':'Hide sidebar';b.setAttribute('aria-pressed',String(w));pref.set('wide',w)}
setWide(pref.get('wide')===true);$('toggle').onclick=()=>setWide(!$('cols').classList.contains('wide'));
function card(q){
  const c=el('article','q');c.append(el('h3',null,q.title||q.id),el('div','src',[q.session,q.from].filter(Boolean).join(' · ')));
  if(q.context)c.append(el('p',null,q.context));
  if(q.recommendation){const r=el('p','rec');r.append(el('b',null,'Recommended: '),document.createTextNode(q.recommendation));c.append(r)}
  const send=async(a)=>{btns.forEach(b=>b.disabled=true);try{await db.doc('questions/'+q.id).update({status:'answered',answer:a,answeredAt:new Date().toISOString()});delete drafts[q.id]}catch(e){btns.forEach(b=>b.disabled=false);c.append(el('p',null,'Could not save. Try again.'))}};
  const o=el('div','opts'),btns=[];
  (q.options||[]).forEach((t,i)=>{const b=el('button',i===0?'pri':'',t);b.type='button';b.onclick=()=>send(t);btns.push(b);o.append(b)});
  c.append(o);
  const f=el('div','free'),ta=el('textarea');ta.rows=1;ta.id='a-'+q.id;ta.placeholder='Or write your answer';ta.setAttribute('aria-label','Your answer');ta.value=drafts[q.id]||'';ta.oninput=()=>{drafts[q.id]=ta.value};
  const s=el('button',null,'Send');s.type='button';s.onclick=()=>{const v=ta.value.trim();if(v)send(v)};btns.push(s);
  f.append(ta,s);c.append(f);return c}
function renderQ(){
  const open=qs.filter(q=>q.status!=='answered'),ans=qs.filter(q=>q.status==='answered');
  const sessions=[...new Set(open.map(q=>q.session||'Other'))].sort();
  if(filter!=='All'&&!sessions.includes(filter))filter='All';
  const ch=$('chips');ch.replaceChildren();
  ['All',...sessions].forEach(k=>{const n=k==='All'?open.length:open.filter(q=>(q.session||'Other')===k).length;const b=el('button','chip',k+' '+n);b.type='button';b.setAttribute('aria-pressed',String(k===filter));b.onclick=()=>{filter=k;renderQ()};ch.append(b)});
  ch.hidden=!open.length;
  const box=$('qs');box.replaceChildren();
  const shown=filter==='All'?open:open.filter(q=>(q.session||'Other')===filter);
  if(!open.length)box.append(el('div','empty','Nothing is waiting for you.'));
  shown.forEach(q=>box.append(card(q)));
  $('n-q').textContent=open.length;$('s-q').classList.toggle('hot',open.length>0);
  $('sum').textContent=sessions.length+(sessions.length===1?' session':' sessions');
  $('done-s').textContent='Answered ('+ans.length+')';
  const d=$('done');d.replaceChildren();ans.forEach(q=>{const r=el('div','row'),b=el('div');b.append(el('b',null,q.title||q.id),el('div','sub',q.answer||''));r.append(b);d.append(r)})}
function rows(id,list,fn,empty){const b=$(id);b.replaceChildren();if(!list.length)b.append(el('div','empty',empty));list.forEach(x=>b.append(fn(x)))}
function agentRow(a){const r=el('div','row'),b=el('div');b.append(el('b',null,a.role||a.id),el('div','sub',[a.model,a.task].filter(Boolean).join(' · ')));r.append(b,el('span','tag '+(a.state==='working'?'working':'idle'),a.state||'idle'));return r}
function planRow(p){const r=el('div','row'),b=el('div');b.append(el('b',null,p.title||p.id),el('div','sub',[p.lead,p.status].filter(Boolean).join(' · ')));if(p.next)b.append(el('div','next','Next: '+p.next));r.append(b);return r}
function logRow(l){const r=el('div','row'),b=el('div');b.append(el('time',null,when(l.at)),el('div',null,(l.agent||'')+' · '+(l.task||'')),el('div','sub',l.did||''));if(l.decided)b.append(el('div','sub','Decided: '+l.decided));r.append(b);return r}
function fail(){$('sum').textContent='Could not load. Reopen this page.'}
(async()=>{
  const t=setTimeout(fail,10000);
  db=await claude.use('db');
  if(!db){clearTimeout(t);$('sum').textContent='Sign in to see the board.';return}
  const live=(name,fn)=>db.collection(name).onSnapshot(s=>{clearTimeout(t);fn(s.docs.map(d=>({id:d.id,...d.data()})))},fail);
  live('questions',l=>{qs=l.sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));renderQ()});
  live('agents',l=>{const w=l.filter(a=>a.state==='working').length;$('n-a').textContent=w;$('c-a').textContent=w+' working';rows('agents',l.sort((a,b)=>(a.order||0)-(b.order||0)),agentRow,'The roster appears here.')});
  live('plans',l=>{$('n-p').textContent=l.length;$('c-p').textContent=l.length;rows('plans',l,planRow,'Active plans appear here.')});
  live('log',l=>{$('c-l').textContent=l.length;rows('log',l.sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,50),logRow,"Each agent's report appears here.")});
  live('meta',l=>{const s=l.find(x=>x.id==='system');$('sys').textContent=s&&s.line||''});
})();
</script>
